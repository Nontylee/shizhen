<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾帧</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="popup-shell">
    <header class="app-header">
      <img class="brand-mark" src="assets/logo.svg" alt="">
      <div class="brand-copy">
        <strong>拾帧</strong>
        <span id="page-status">正在读取当前页面…</span>
      </div>
      <button class="icon-button" id="open-library" type="button" aria-label="打开素材库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h6l2 2h8v12H4z" stroke-linejoin="round"/><path d="M8 12h8M8 15h5" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-button" id="settings-toggle" type="button" aria-label="偏好设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.8-1L14.4 3h-4.8l-.3 3.1a7 7 0 0 0-1.8 1l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.8 1l.3 3.1h4.8l.3-3.1a7 7 0 0 0 1.8-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="page-context">
      <span class="site-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4zM4 9h16"/><path d="M7 7h.01M10 7h.01" stroke-linecap="round"/></svg>
      </span>
      <div>
        <strong id="page-title">当前网页</strong>
        <span id="page-host">等待连接</span>
      </div>
    </section>

    <div class="section-heading">
      <strong>选择截图方式</strong>
      <span id="mode-hint">自动识别页面元素</span>
    </div>

    <section class="capture-modes" aria-label="截图方式">
      <button class="mode-button is-selected" type="button" data-mode="element" data-label="选择页面元素" data-hint="自动识别页面元素">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="m14 14 6 6M14 20l6-6" stroke-linecap="round"/></svg>
        <strong>元素</strong>
        <span>智能识别</span>
      </button>
      <button class="mode-button" type="button" data-mode="region" data-label="开始框选区域" data-hint="拖动选取任意区域">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke-linecap="round"/><rect x="8" y="8" width="8" height="8" rx="1.5" stroke-dasharray="2 2"/></svg>
        <strong>区域</strong>
        <span>自由框选</span>
      </button>
      <button class="mode-button" type="button" data-mode="full" data-label="开始滚动截取" data-hint="滚动拼接整个网页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l3 3v15H6z" stroke-linejoin="round"/><path d="M15 3v4h4M9 11h6M9 15h6" stroke-linecap="round"/></svg>
        <strong>整页</strong>
        <span>滚动长图</span>
      </button>
    </section>

    <div class="section-heading destination-heading">
      <strong>归档位置</strong>
      <span>本地素材库</span>
    </div>

    <button class="destination-button" id="destination-button" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h6l2 2h8v12H4z" stroke-linejoin="round"/></svg>
      <strong id="destination-name">产品灵感 / 待整理</strong>
      <span>切换 ›</span>
    </button>

    <button class="capture-button" id="capture-button" type="button">选择页面元素 <span>⌥ ⇧ S</span></button>
    <div class="secondary-actions">
      <button id="visible-capture" type="button">直接截取当前画面</button>
      <button id="delayed-capture" type="button">延时 3 秒</button>
    </div>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  </main>
  <script src="folders.js"></script>
  <script src="popup.js"></script>
</body>
</html>
