name: Bug 反馈
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际发生了什么，以及你预期看到什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS 15 / Chrome 140 / 拾帧 0.3.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 请在上传截图前遮挡个人信息。

