<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾帧 · 素材库</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/logo.svg" alt="">
      <div><strong>拾帧</strong><span>本地素材库</span></div>
    </div>
    <div class="folder-heading">
      <span>文件夹</span>
      <button id="add-folder" type="button" aria-label="新建文件夹" title="新建文件夹">＋</button>
    </div>
    <nav id="folder-list" aria-label="文件夹">
      <button class="nav-button is-selected" type="button" data-folder="all">
        <span>全部素材</span><strong id="all-count">0</strong>
      </button>
    </nav>
    <p class="storage-note">所有素材只保存在当前浏览器中。</p>
  </aside>

  <main class="library-main">
    <header class="library-header">
      <div>
        <h1 id="view-title">全部素材</h1>
        <p id="view-description">最近保存的网页截图</p>
      </div>
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" placeholder="搜索标题、标签或来源">
      </label>
    </header>

    <section class="empty-state" id="empty-state" hidden>
      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h6l2 2h8v12H4z" stroke-linejoin="round"/><path d="M9 12h6M12 9v6" stroke-linecap="round"/></svg>
      </div>
      <h2>还没有截图素材</h2>
      <p>在普通网页中点击拾帧扩展，完成第一次截图。</p>
    </section>

    <section class="item-grid" id="item-grid" aria-live="polite"></section>
  </main>

  <aside class="detail-panel" id="detail-panel" hidden>
    <button class="close-detail" id="close-detail" type="button" aria-label="关闭详情">×</button>
    <img id="detail-image" alt="截图预览">
    <h2 id="detail-title"></h2>
    <p class="detail-meta" id="detail-meta"></p>
    <div class="tag-list" id="detail-tags"></div>
    <a id="detail-source" href="#" target="_blank" rel="noreferrer">打开来源页面</a>
    <div class="detail-actions">
      <button id="detail-download" type="button">下载</button>
      <button class="danger-button" id="detail-delete" type="button">删除</button>
    </div>
  </aside>

  <dialog class="folder-dialog" id="folder-dialog">
    <form id="folder-form">
      <h2 id="folder-dialog-title">新建文件夹</h2>
      <label for="folder-name">文件夹名称</label>
      <input id="folder-name" type="text" maxlength="40" autocomplete="off" placeholder="例如：产品设计参考">
      <p class="folder-error" id="folder-error" role="alert"></p>
      <div class="folder-dialog-actions">
        <button class="danger-button" id="delete-folder" type="button" hidden>删除</button>
        <span></span>
        <button id="cancel-folder" type="button">取消</button>
        <button class="primary-folder-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <script src="asset-db.js"></script>
  <script src="folders.js"></script>
  <script src="library.js"></script>
</body>
</html>
